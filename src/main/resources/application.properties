spring.application.name=articulos-api

# Render inyecta el puerto en la variable PORT; en local cae a 8080
server.port=${PORT:8080}

# Datasource externalizado. La URL se arma a partir de variables separadas, las mismas
# que TiDB Cloud entrega en "Connect > Connect with .env":
#   DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
# DB_SSL_MODE controla el cifrado: por defecto VERIFY_IDENTITY (lo que exige TiDB).
# Para un MySQL local sin SSL, defini DB_SSL_MODE=DISABLED.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:articulos_db}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
